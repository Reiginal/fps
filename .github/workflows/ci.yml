# push と PR のたびに、手元でやっているのと同じ検査を自動で走らせる。
#
# なぜ要るか: このリポジトリの検査は1400項目あるが、
# 走らせるのを忘れたら意味がない。忘れられない場所に置くのがCIの役目。
#
# ---------------------------------------------------------------------------
# **ここは速さを最優先にしてある。** 2026-08-07に2分30秒から30秒前後へ削った。
#
# 個人開発なので、PRを出してから緑になるまでが待ち時間そのものになる。
# 2分待つと、その間に別の事を始めてしまって戻ってこない。
# 「ほぼ待たない」まで縮めば、検査は開発のテンポの外側に出る。
#
# 何を削って何を残したかは、下のそれぞれの場所にコメントで書いてある。
# **削った物は考え方としては良い物なので、戻せる形で残してある。**
# ---------------------------------------------------------------------------

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けてpushした時、古い実行を打ち切る。
# 3回続けてpushすると3回ぶん並ぶが、見たいのは最後の1回だけ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    name: 検査

    # ------------------------------------------------------------------
    # **Node 20と22の2本立てをやめた。**
    #
    # 元の狙いは「手元のv24以外でも動くか」を見ることで、それ自体は正しい。
    # ただ実際に走らせた記録を見ると、20と22で結果が割れた事が1度も無い。
    # このリポジトリはNodeの新しい機能を使っておらず、
    # サーバー側もwsとnode:httpだけで、版で挙動が変わる所を踏んでいない。
    #
    # 2本にすると、同じ検査を2回やるぶん実行の枠を2つ使う。
    # 待ち時間は変わらない（並ぶので）が、混んでいる時に順番待ちが起きる。
    # 版の食い違いを見たくなったら、ここを戻す:
    #
    #   strategy:
    #     fail-fast: false
    #     matrix:
    #       node: [20, 22]
    #   name: Node ${{ matrix.node }}
    #   ...
    #     node-version: ${{ matrix.node }}
    #
    # 下限(20)で動くかは package.json の engines に書いてあるだけの約束になる。
    # そこが心配になったら、月1回だけ走らせる形（schedule）にするのも手
    # ------------------------------------------------------------------

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # package-lock.json を鍵にして依存のダウンロードを使い回す
          cache: npm

      # ci は install と違って package-lock.json の通りに正確に入れる。
      # 手元と違う版が入って「CIだけ落ちる」を防ぐ
      - name: 依存を入れる
        run: npm ci

      - name: 静的解析
        run: npm run lint

      # ------------------------------------------------------------------
      # **検査を1本ずつ別のステップに並べるのをやめた。**
      #
      # 元は33本を33ステップに分けてあった。狙いは「どれが赤いか画面で見える」
      # ことで、これも正しい。ただ、そのために1本ずつ順番に走らせることになり、
      # 33本で55秒かかっていた。うち音の質の1本だけで15秒あり、
      # 残り32本はその間ずっと待っていた。
      #
      # 今は tools/run-checks.mjs が中でCPUの数だけ同時に走らせる。
      # 落ちた物だけ中身を全部出すので、「どれが赤いか」は結局そのまま見える。
      #
      # 走らせる検査の一覧はどこにも書かない。あちらが tools/ を読んで見つける。
      # **検査を足したらここを直す必要が無い**（前は3箇所を手で揃えていた）
      # ------------------------------------------------------------------
      - name: 検査
        run: npm run check

  # --------------------------------------------------------------------
  # **本物のブラウザで開く検査は、ここから外した。**
  #
  # 消したのではなく、本番へ出す直前(.github/workflows/deploy.yml)へ移した。
  # 繋がっているかは tools/check-meta.mjs の[5]が見張っている。
  #
  # 外した理由は時間。GPUの無い機械でこの場面をCPUで塗るので、
  # ブラウザ本体を落とすのに31秒、開いて確かめるのに81秒かかっていた。
  # **CI全体の2分30秒のうち、2分5秒がこれ1本。**
  #
  # 一方でこれが拾う失敗（importの書き間違いで真っ黒）は、
  # tools/check-imports.mjs がブラウザ無しで0.1秒で拾えるようになった。
  # 読み込みの繋がりをそっくり辿って、importmapで行き先が決まるか・
  # ファイルがあるか・外へ配る決まりがあるかを見ている。
  #
  # 残った差は「本当に画が出るか」だけ。そこは出す直前に1回見れば足りる。
  #
  # PRのたびに見たくなったら、ここを戻す:
  #
  #   e2e:
  #     runs-on: ubuntu-latest
  #     name: ブラウザで開く
  #     steps:
  #       - uses: actions/checkout@v5
  #       - uses: actions/setup-node@v5
  #         with: { node-version: 22, cache: npm }
  #       - run: npm ci
  #       - run: npx playwright install --with-deps chromium
  #       - run: npm run e2e
  # --------------------------------------------------------------------
