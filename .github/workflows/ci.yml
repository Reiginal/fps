# push と PR のたびに、手元でやっているのと同じ検査を自動で走らせる。
#
# なぜ要るか: このリポジトリの検査(tools/check-*.mjs)は510項目あるが、
# 走らせるのを忘れたら意味がない。忘れられない場所に置くのがCIの役目。
#
# 検査を1本ずつ別のステップに分けてあるのは、まとめて1ステップにすると
# 最初に落ちた1本で止まって、残りが走らないため。
# 分けておくと「どれが赤いか」が画面でそのまま見えるし、
# 1回の実行で壊れている箇所を全部数えられる。

name: CI

on:
  push:
    branches: [main]
  pull_request:

# 同じブランチに続けてpushした時、古い実行を打ち切る。
# 3回続けてpushすると3回ぶん並ぶが、見たいのは最後の1回だけ
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest

    strategy:
      # 片方が落ちてももう片方は最後まで走らせる。
      # 「20だけ落ちた」のか「両方落ちた」のかで原因が変わる
      fail-fast: false
      matrix:
        # 手元はv24だが、他の版で動くか一度も確かめていない。
        # 20はこのリポジトリが動く下限として package.json の engines に書いた版、
        # 22はその次の長期サポート版
        node: [20, 22]

    name: Node ${{ matrix.node }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          # package-lock.json を鍵にして依存のダウンロードを使い回す
          cache: npm

      # ci は install と違って package-lock.json の通りに正確に入れる。
      # 手元と違う版が入って「CIだけ落ちる」を防ぐ
      - name: 依存を入れる
        run: npm ci

      - name: 静的解析
        run: npm run lint

      # tools/check-*.mjs は import した物しか見ない。
      # 読み込まれないファイル（src/world/level.js など）の構文の壊れは
      # ここで拾う
      - name: 構文チェック
        run: |
          fail=0
          for f in $(find src server tools \( -name '*.js' -o -name '*.mjs' \)); do
            node --input-type=module --check < "$f" || { echo "構文NG $f"; fail=1; }
          done
          exit $fail

      # 一番先に走らせる。検査を書いたのに繋ぎ忘れている、を真っ先に知りたい
      - name: 検査 検査そのものの繋がり
        run: node tools/check-meta.mjs

      - name: 検査 呼び先とHUDの部品
        run: node tools/check-calls.mjs

      - name: 検査 外へ配る物
        run: node tools/check-serve.mjs

      - name: 検査 HUD
        run: node tools/check-hud.mjs

      - name: 検査 武器
        run: node tools/check-weapons.mjs

      - name: 検査 持ち物
        run: node tools/check-loadout.mjs

      - name: 検査 音が例外にならないか
        run: node tools/check-audio.mjs

      - name: 検査 音のノードが解放されるか
        run: node tools/check-audio-leak.mjs

      - name: 検査 音の質
        run: node tools/check-sound.mjs

      - name: 検査 包帯
        run: node tools/check-heal.mjs

      - name: 検査 ロビー
        run: node tools/check-lobby.mjs

      - name: 検査 遊び方
        run: node tools/check-modes.mjs

      - name: 検査 敵の散らばり
        run: node tools/check-swarm.mjs

      - name: 検査 狙いの当たり具合
        run: node tools/check-aim.mjs

      - name: 検査 発言
        run: node tools/check-chat.mjs

      - name: 検査 キャラクター選択
        run: node tools/check-character.mjs

      - name: 検査 当たり判定と見た目
        run: node tools/check-hitbox.mjs

      - name: 検査 エラーの受け口
        run: node tools/check-report.mjs

      - name: 検査 電文の食い違い
        run: node tools/check-protocol.mjs

      # 電文の項目名が揃っていても、中身のビットの読み替えがずれると
      # 同じキーを押したのに片側だけ効かない。そこは実際に両方走らせて比べる
      - name: 検査 手元とサーバーで移動が一致するか
        run: node tools/check-parity.mjs

      - name: 検査 ログ
        run: node tools/check-logs.mjs

      - name: 検査 装填
        run: node tools/check-reload.mjs

      - name: 検査 キーボードと全画面
        run: node tools/check-input.mjs

      - name: 検査 画面効果
        run: node tools/check-postfx.mjs

      - name: 検査 倒れている間のカメラ
        run: node tools/check-deathcam.mjs

      - name: 検査 設定
        run: node tools/check-settings.mjs

      - name: 検査 戦績と実績
        run: node tools/check-stats.mjs

      - name: 検査 回線が切れた後の復帰
        run: node tools/check-rejoin.mjs

      - name: 検査 地形のメモリ
        run: node --expose-gc tools/check-world.mjs
