# mainへ入った物を本番へ反映する。
#
# 人が本番へ手でコマンドを打たない形にするのがこれの目的。
# 手で打つ運用だと「今動いているのはどのコミットか」が誰にも分からなくなるし、
# 打ち間違いも起きる。mainに入った物＝本番、という対応を機械で保つ。
#
# 鍵(FLY_API_TOKEN)はGitHubのSecretsに置く。手元にも置かない。
# 初回だけ以下を打って登録する:
#   fly tokens create deploy -x 8760h
#   gh secret set FLY_API_TOKEN --body "<出てきた文字列>"
#
# ---------------------------------------------------------------------------
# **mainを検査するのはここだけ。** 2026-08-09にci.ymlのpushの引き金からmainを外した。
# それまではマージした瞬間にci.ymlとdeploy.ymlが両方走って、
# **同じコミットに対して同じlintと同じcheckを2回**やっていた。
# 消す先をdeploy.yml側にしなかったのは、こちらが本番を止める関門だから
# （ci.ymlが赤くなってもdeployは止まらない。2つは繋がっていない）。
#
# 仕事を3つに分けて、検査とブラウザを同時に走らせる。
# 1本に並べていた時は 2.4分。分けて 1.9分。
# 残る47秒は flyctl がFly側でイメージを焼いて機械を差し替える時間で、
# **こちらからは短くできない。** そこが底になる
# ---------------------------------------------------------------------------

name: Deploy

on:
  push:
    branches: [main]
    # 根元の文書だけを直した回は、本番を焼き直さない。
    # CLAUDE.md・課題.md・やりたいこと.md・README.md が該当する。
    # **配っている物が1バイトも変わらないのに1.5分かけていた。**
    #
    # `*.md` は根元だけに当たる（`*` は / をまたがない）。
    # `**/*.md` にしないのは、**assets/ の下は丸ごと外へ配っている**ため
    # （assets/models/CREDITS.md も配る物の一部。server/serve-rules.js を参照）。
    # ここへ配る物の拡張子を足すと、直したのに本番へ出ない形になるので、
    # tools/check-meta.mjs の[5-3]が中身を見張っている
    paths-ignore:
      - '*.md'
  # コミットを増やさずに入れ直したい時のための手動の口。
  # 本番が変な状態になった時、まずこれを押せば直ることが多い。
  # 上で飛ばした回を手で出したくなった時も、ここから出せる
  workflow_dispatch:

# デプロイは同時に走らせない。2つ同時に走ると、後から始まった方が
# 先に終わって、古いコミットが本番に残ることがある。
# cancel-in-progress は false。途中で切ると中途半端な状態で止まる
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  # 出す前にもう一度確かめる。
  # ブランチ保護で「CIが緑でないとマージできない」ようにはしてあるが、
  # 検査したのはPRの中身であって、mainへ混ぜた後の状態ではない。
  # 混ざった結果が壊れている可能性は残るので、出す直前にもう一度通す
  check:
    name: 検査
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: 静的解析
        run: npm run lint

      - name: 検査
        run: npm run check

  # ------------------------------------------------------------------
  # **本物のブラウザで開く検査。ここが最後の砦。**
  #
  # 上の検査はどれもNodeの中でクラスを動かしているだけで、
  # index.htmlとimportmapが噛み合っているか・全部のモジュールが本当に
  # 読み込めるか・開いた結果ホーム画面まで来るかを見ていない。
  # **importを1行書き間違えただけで、検査は全部通ったまま、
  # 開いたら真っ黒**という形が作れる（実際に壊して確かめた）。
  #
  # 元はPRのたびに走らせていたが、GPUの無い機械ではこの場面をCPUで塗るので
  # 2分かかり、CI全体の待ち時間の大半がこれだった。
  # **出す直前に1回だけ**に変えてある。
  #
  # 落ちると下の「本番へ出す」が始まらないので、本番は前のままになる。
  # **止まるのは needs: で繋いであるからで、仕事を分けたこと自体ではない。**
  # 昔まさに「別の仕事として横で走っていただけで、赤くても本番へ出ていた」形だった。
  # 繋ぎ忘れると黙ってそこへ戻るので、tools/check-meta.mjs の[5]が見張っている
  # ------------------------------------------------------------------
  e2e:
    name: ブラウザで開いて確かめる
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # ブラウザ本体は毎回落とすと30秒かかる。中身は playwright の版でしか
      # 変わらないので、package-lock.json を鍵にして使い回す
      - name: ブラウザを使い回す
        id: browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # ------------------------------------------------------------------
      # **使い回せた回は --with-deps を付けない。**
      #
      # --with-deps は動かすのに要るライブラリを apt で入れる指定で、
      # **本体を使い回せた回でも必ず走る**（aptはキャッシュの外なので）。
      # 実測で、使い回しが3秒で戻ってきた回でもここだけ20秒かかっていた。
      # ubuntu-latest の実行環境には元から入っているので、
      # 本体が揃っている回は確認だけで済ませる。約15秒。
      #
      # 危ない所: GitHub側の実行環境の中身が変わってライブラリが欠けた日に落ちる。
      # ただし落ちるのはこの仕事なので、**本番へは出ない**（下の ship が needs で止まる）。
      # その時は下の「初回」の側だけが残るよう、鍵を変えて入れ直せばよい
      # ------------------------------------------------------------------
      - name: ブラウザを入れる（初回はライブラリごと）
        if: steps.browser.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: ブラウザを確かめる（使い回せた時）
        if: steps.browser.outputs.cache-hit == 'true'
        run: npx playwright install chromium

      # サーバーの起動と停止は playwright.config.mjs がやる
      - name: ブラウザで開いて確かめる
        run: npm run e2e

      # 落ちた時だけ、その瞬間の画像と記録を残す。
      # **ブラウザの中で起きた事は、これが無いと後から何も分からない**
      - name: 落ちた時の記録を残す
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  ship:
    name: 本番へ出す
    # **両方が緑でないと始まらない。ここが関門。**
    # 消すと、検査が赤いまま本番へ出る形に戻る（昔そうだった）
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      # 組み立てはFly側でやるので、ここに要るのはDockerfileと中身だけ。
      # nodeもnpm ciも要らない（1本に並べていた頃の名残で入れていた）
      - uses: actions/checkout@v5

      # 他人のリポジトリのコードを、このジョブの中で走らせている。
      # @master のような枝で指すと、向こうが差し替えた物が次の実行からそのまま動く。
      # このジョブには本番へ出す鍵(FLY_API_TOKEN)がいるので、
      # 向こうが乗っ取られた日に鍵ごと持っていかれる。
      # だからコミットのIDで固定する。IDは中身が1ビットでも変われば変わるので、
      # 「あの時見た物」以外は動かない。
      # 下のIDは v1 / 1.6 のタグが指しているのと同じ場所。
      # 上げたい時は tags を見て、新しいIDへ手で書き換える
      - uses: superfly/flyctl-actions/setup-flyctl@ed8efb33836e8b2096c7fd3ba1c8afe303ebbff1  # v1.6

      # --remote-only はコンテナの組み立てをFly側でやる指定。
      # GitHubの実行環境でDockerを動かすより速く、依存の取り直しも向こうで使い回される
      - name: 本番へ出す
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
